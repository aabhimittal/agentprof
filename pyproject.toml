[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentprof"
version = "0.1.0"
description = "Flamegraph profiler for agent token spend. Local-only, zero dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Abhishek Mittal" }]
keywords = ["llm", "agents", "profiling", "flamegraph", "tokens", "cost", "claude"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Debuggers",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/aabhimittal/agentprof"
Demo = "https://aabhimittal.github.io/agentprof/"

[project.scripts]
agentprof = "agentprof.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["agentprof"]

[tool.hatch.build.targets.sdist]
include = ["agentprof", "tests", "README.md", "LICENSE"]
